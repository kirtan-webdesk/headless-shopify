name: Shopify Theme Push (Dev)

# Auto-pushes theme files to the project's dev theme on every commit to feature/* or fix/* branches.
# Developers see their changes at the preview URL within ~90 seconds.

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  # Cancel in-progress runs for same branch (saves CI time + cost)
  group: theme-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-to-dev-theme:
    name: Push to dev theme
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI
        run: |
          npm install -g @shopify/cli@latest @shopify/theme@latest
          shopify version

      - name: Push to dev theme
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_DEV_THEME_ID: ${{ secrets.SHOPIFY_DEV_THEME_ID }}
        run: |
          shopify theme push \
            --store "$SHOPIFY_STORE_URL" \
            --theme "$SHOPIFY_DEV_THEME_ID" \
            --path . \
            --nodelete

      - name: Comment preview URL on commit
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://${{ secrets.SHOPIFY_STORE_URL }}/?preview_theme_id=${{ secrets.SHOPIFY_DEV_THEME_ID }}`;
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🎨 Theme pushed to dev. Preview: [${previewUrl}](${previewUrl})`
            });
